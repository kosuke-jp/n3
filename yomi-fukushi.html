<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>得点アップ 読み方＆副詞チャレンジ｜N3 試験直前 満点サプリ</title>
<style>
:root{
  --ink:#1a1a1a; --accent:#3b82f6; --accent2:#2f6fd6; --bg2:#faf9f6; --bd:#e2e0d8; --bd2:#d0cec6;
  --mut:#7a7a7a; --ok:#166534; --okbg:#f0fdf4; --okbd:#86efac;
  --ng:#dc2626; --ngbg:#fef2f2; --ngbd:#fca5a5; --amber:#f59e0b; --ambg:#fffbeb; --ambd:#fde68a;
  --kr:#1e40af; --krbg:#eff6ff; --krbd:#bfdbfe;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Sans","Noto Sans CJK JP","Noto Sans CJK KR","Noto Sans JP","Malgun Gothic",sans-serif;color:var(--ink);background:#e9eaee;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hidden{display:none!important}
#bar{position:sticky;top:0;z-index:5;height:50px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--bd);background:var(--bg2)}
#bar .home{flex:none;font-size:13px;font-weight:700;color:#555;text-decoration:none;border:1px solid var(--bd2);border-radius:8px;padding:5px 10px;background:#fff}
#bar .brand{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .brand .a{color:var(--accent)}
#bar .sp{flex:1}
#bar .cnt{font-size:13px;font-weight:800;color:#555;white-space:nowrap}
#prog{height:5px;background:var(--bd);flex:none}
#prog div{height:100%;background:var(--accent);width:0;transition:width .2s}
#stage{flex:1;padding:16px 14px 24px}
#ctrl{position:sticky;bottom:0;flex:none;display:flex;gap:10px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--bd);background:var(--bg2)}
.btn{border:1px solid var(--bd2);background:#fff;color:#444;font-size:15px;font-weight:700;padding:12px 18px;border-radius:10px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}

.start h1{font-size:25px;font-weight:900;line-height:1.35;margin:8px 0 6px}
.start h1 .a{color:var(--accent)}
.start .sub{font-size:14px;color:#444;line-height:1.6}
.start .subk{font-size:13px;color:var(--kr);margin:4px 0 18px;line-height:1.5}
.setcard{border:2px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--bg2)}
.setcard h2{font-size:19px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.setcard h2 .n{background:var(--accent);color:#fff;border-radius:8px;padding:1px 10px}
.setcard h2 small{font-size:12px;color:#777;font-weight:700}
.setcard ol{list-style:none;margin-bottom:10px}
.setcard li{font-size:14.5px;font-weight:700;padding:6px 2px;border-bottom:1px dashed var(--bd);display:flex;gap:8px;align-items:baseline}
.setcard li .no{color:var(--accent);font-weight:900}
.setcard li .k{margin-left:auto;font-size:11.5px;color:var(--kr);font-weight:600;white-space:nowrap}
.again{display:block;margin-top:8px;font-size:13px;color:#92700e;background:var(--ambg);border:1px solid var(--ambd);border-radius:10px;padding:9px;text-align:center;font-weight:700;cursor:pointer;font-family:inherit;width:100%}

.cover .rno{font-size:13px;font-weight:900;color:var(--accent);letter-spacing:1px;margin-top:6px}
.cover h2{font-size:27px;font-weight:900}
.cover .krn{font-size:15px;color:var(--kr);font-weight:700;margin-bottom:14px}
.kotsu{border:2px solid var(--ambd);background:var(--ambg);border-radius:14px;padding:14px}
.kotsu .lab{font-size:13px;font-weight:900;color:#92700e;margin-bottom:4px}
.kotsu .jp{font-size:16px;line-height:1.65;font-weight:600}
.kotsu .kr{font-size:13.5px;color:var(--kr);margin-top:6px;line-height:1.55}
.kotsu ul{list-style:none;margin-top:10px;display:grid;gap:6px}
.kotsu li{font-size:15px;background:#fff;border:1px solid var(--ambd);border-radius:9px;padding:7px 10px;line-height:1.5}
.kotsu li b{color:var(--ng)}

.qtag{font-size:12.5px;font-weight:800;color:var(--accent)}
.inst{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.5}
.sent{font-size:21px;font-weight:600;margin:18px 0 18px;line-height:1.65;white-space:pre-line}
.sent u{text-decoration:none;border-bottom:3px solid var(--ink);padding:0 2px}
.word{font-size:36px;font-weight:900;text-align:center;margin:12px 0 14px;letter-spacing:3px}
.choices{display:grid;gap:9px}
.choice{display:flex;align-items:center;gap:12px;border:2px solid var(--bd);border-radius:12px;padding:12px 13px;font-size:19px;font-weight:600;background:#fff;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.choice.long{font-size:15.5px;line-height:1.45}
.choice .no{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#666}
.choice.correct{border-color:var(--okbd);background:var(--okbg)}
.choice.correct .no{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{border-color:var(--ngbd);background:var(--ngbg)}
.choice.wrong .no{background:var(--ng);border-color:var(--ng);color:#fff}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.fb.ok{background:var(--okbg);border:1px solid var(--okbd)}
.fb.ng{background:var(--ambg);border:1px solid var(--ambd)}
.fb .h{font-weight:900;font-size:16px;margin-bottom:3px}
.fb.ok .h{color:var(--ok)} .fb.ng .h{color:#92700e}
.fb .k{display:block;color:var(--kr);font-size:13.5px;margin-top:4px;font-weight:600}

.res h2{font-size:23px;font-weight:900;margin:6px 0 4px}
.res .krs{font-size:13.5px;color:var(--kr);margin-bottom:12px;line-height:1.5}
.rounds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rd{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:var(--bg2)}
.rd .t{font-size:12px;font-weight:800;color:#555}
.rd .v{font-size:20px;font-weight:900;color:var(--accent)}
.rd .v.full{color:var(--ok)}
.nobi .t{font-size:15px;font-weight:900;color:#92700e}
.nobi .t span{display:block;font-size:12px;color:var(--kr);font-weight:600}
.nchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.nchip{border:1px solid var(--ambd);background:var(--ambg);color:#92700e;font-weight:800;font-size:14.5px;padding:7px 11px;border-radius:10px;cursor:pointer;font-family:inherit}
.great{font-size:19px;font-weight:900;color:var(--ok);margin:10px 0 14px}
.rbtns{display:grid;gap:9px}
.copied{color:var(--ok);font-weight:700;font-size:13px;text-align:center}
#copyBox{width:100%;height:96px;margin-top:8px;font-size:14px;padding:8px;border:1px solid var(--bd2);border-radius:8px;font-family:inherit}

#explain{position:fixed;inset:0;background:rgba(20,20,25,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.ex-card{width:100%;max-width:520px;background:#fff;border-radius:14px;overflow:hidden}
.ex-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--ambg);border-bottom:1px solid var(--ambd)}
.ex-head b{font-size:17px;color:#92700e}
#ex-close{background:#fff;border:1px solid var(--bd2);border-radius:8px;width:32px;height:32px;font-size:14px;cursor:pointer;font-family:inherit}
#ex-body{padding:14px;font-size:15px;line-height:1.65}
#ex-body .s{font-size:16px;background:var(--bg2);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;margin-bottom:10px}
#ex-body .a{color:var(--ok);font-weight:800}
#ex-body .k{display:block;color:var(--kr);font-size:13.5px;font-weight:600;margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <a class="home" href="index.html" onclick="return leaveOk()">‹ 一覧</a>
    <span class="brand">得点アップ <span class="a">読み方＆副詞</span></span>
    <span class="sp"></span>
    <span class="cnt" id="cnt"></span>
  </div>
  <div id="prog" class="hidden"><div id="progBar"></div></div>
  <div id="stage"></div>
  <div id="ctrl" class="hidden"><button class="btn primary" id="nextBtn">次へ →</button></div>
  <div id="explain" class="hidden"><div class="ex-card"><div class="ex-head"><b id="ex-title"></b><button id="ex-close">✕</button></div><div id="ex-body"></div></div></div>
</div>
<script>
// 第4回模試前 得点アップ 読み方＆副詞チャレンジ — 共通データ
// o[0] が正解。表示時に選択肢を混ぜる。f: yomi=漢字読み / hyoki=表記 / bun=文脈・文法 / yoho=用法
const INST = {
  yomi: '＿＿＿のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。',
  hyoki:'＿＿＿のことばを漢字で書くとき、最もよいものを、1・2・3・4から一つえらびなさい。',
  bun:  '（　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。',
  yoho: 'つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。'
};
const FMT = { yomi:'問題1 漢字読み', hyoki:'問題2 表記', bun:'問題3 文脈規定・文法', yoho:'問題5 用法' };

const SETS = [
// ======================= コマ① =======================
{ n:1, label:'①', title:'セット①', rounds:[
 { id:'daku', name:'濁る？ 濁らない？', kr:'탁음일까? 청음일까?',
   tip:{ jp:'韓国語は、ことばの最初の音が濁るかどうかを区別しない。だから耳ではなく「この字は濁る」と字ごとに覚える。同じ字でも、ことばによって変わるものがある。',
         kr:'한국어는 어두의 청음·탁음을 구별하지 않는다. 귀가 아니라 "이 글자는 탁음"이라고 글자별로 외운다.',
         ex:['大会 <b>た</b>いかい ⇔ 大学 <b>だ</b>いがく（同じ「大」）','期限・門限 → 「限」は <b>げん</b>','本＋たな → ほん<b>だ</b>な（つながると濁る＝連濁）'] },
   items:[
    {f:'yomi',k:'移転',s:'会社が来月、駅の近くに<u>移転</u>する。',o:['いてん','いでん','いってん','いてい'],n:'いてん。「転」は濁らない（運転 うんてん）。「いでん」は遺伝で、別のことば。',kr:'転 전 → てん（運転 운전 = うんてん）'},
    {f:'yomi',k:'門限',s:'この寮の<u>門限</u>は夜11時です。',o:['もんげん','もんけん','もうげん','もんがん'],n:'もんげん。「限」は「げん」と濁る（期限 きげん・制限 せいげん）。',kr:'限 한 → げん（ㅎ로 시작하는 글자는 か·が행이 되기 쉽다）'},
    {f:'yomi',k:'番組',s:'好きなテレビ<u>番組</u>は何ですか。',o:['ばんぐみ','ばんくみ','はんぐみ','ばんこみ'],n:'番＋組（くみ）→ ばんぐみ。後ろの「くみ」が濁る。',kr:'연탁: くみ → ぐみ'},
    {f:'yomi',k:'期限',s:'借りた本の返却<u>期限</u>は2週間です。',o:['きげん','きけん','ぎげん','きかん'],n:'きげん。「きけん」は危険、「きかん」は期間。門限と同じ「げん」。',kr:'期限 기한 → きげん'},
    {f:'yomi',k:'大会',s:'来週、サッカーの<u>大会</u>に出る。',o:['たいかい','だいかい','たいがい','だいがい'],n:'たいかい。大会・大切は「たい」、大学・大事は「だい」。',kr:'大 대 → たい／だい 둘 다 있음. 단어로 외운다'},
    {f:'yomi',k:'本棚',s:'部屋に新しい<u>本棚</u>を置いた。',o:['ほんだな','ほんたな','ぼんだな','ぼんたな'],n:'本＋棚（たな）→ ほんだな。',kr:'연탁: たな → だな'},
    {f:'yomi',k:'価格',s:'この店は、ほかの店より<u>価格</u>が安い。',o:['かかく','かがく','がかく','かかぐ'],n:'かかく。「かがく」は科学。',kr:'価格 가격 → かかく（둘 다 청음）'},
    {f:'yomi',k:'中止',s:'雨のため、試合は<u>中止</u>になった。',o:['ちゅうし','ちゅうじ','じゅうし','じゅうじ'],n:'ちゅうし。「止」は濁らない（禁止 きんし）。',kr:'止 지 → し（청음）'}
   ]},
 { id:'nobasu', name:'のばす？ のばさない？', kr:'장음일까? 단음일까?',
   tip:{ jp:'韓国語読みに ㅇ・ㅂ パッチムがある字は、ほぼのばす。パッチムがない字は短いことが多い。ただし「豪・交・表・調」のように、パッチムがなくてものばす字は一つずつ覚える。',
         kr:'ㅇ·ㅂ 받침 → 거의 장음. 받침 없음 → 대부분 단음. 단, 받침 없어도 장음인 글자(豪·交·表·調)는 따로 외운다.',
         ex:['ㅇ：交通 교<b>통</b> → こう<b>つう</b>','받침 없음：主人 <b>주</b>인 → <b>しゅ</b>じん（のばさない）','例外：豪 <b>호</b> → <b>ごう</b>（のばす）'] },
   items:[
    {f:'yomi',k:'小型',s:'旅行用に<u>小型</u>のカメラを買った。',o:['こがた','こうがた','こかた','しょうがた'],n:'こがた。「小」は訓読みの「こ」（小鳥 ことり）、「型」は「がた」と濁る（大型 おおがた）。',kr:'小型 = こ＋がた（훈독 + 탁음）. のばさない'},
    {f:'yomi',k:'豪華',s:'結婚式は<u>豪華</u>なホテルで行われた。',o:['ごうか','ごか','こうか','ごうが'],n:'ごうか。「こうか」は効果。',kr:'豪 호 → ごう（받침 없어도 장음＋탁음）'},
    {f:'yomi',k:'主人',s:'少々お待ちください。<u>主人</u>を呼んでまいります。',o:['しゅじん','しゅうじん','しゅにん','しゅうにん'],n:'しゅじん。のばすと「囚人（しゅうじん）」。「しゅにん」は主任。',kr:'主 주 → しゅ（짧게）. 住 주 → じゅう 와 구별'},
    {f:'yomi',k:'交通',s:'駅のまわりは<u>交通</u>が便利だ。',o:['こうつう','こつう','こうつ','こうずう'],n:'こうつう。どちらものばす。',kr:'交 교 → こう ／ 通 통(ㅇ) → つう'},
    {f:'yomi',k:'美容院',s:'姉は駅前の<u>美容院</u>で働いている。',o:['びよういん','びょういん','びよいん','びょいん'],n:'び・よう・いん。大きい「よ」。「びょういん」は病院。',kr:'美 미 → び（짧게）／ 容 용(ㅇ) → よう'},
    {f:'yomi',k:'貯金',s:'毎月少しずつ<u>貯金</u>している。',o:['ちょきん','ちょうきん','ちょぎん','ちょうぎん'],n:'ちょきん。「貯」はのばさない。「金」は濁らない。',kr:'貯 저 → ちょ（짧게）'},
    {f:'yomi',k:'都合',s:'今日は<u>都合</u>が悪いので、明日にしてください。',o:['つごう','つうごう','とごう','つこう'],n:'つごう。「都」は短く、「合」は濁ってのばす。',kr:'合 합(ㅂ) → ごう'},
    {f:'yomi',k:'努力',s:'毎日<u>努力</u>を続けることが大切だ。',o:['どりょく','どうりょく','とりょく','どりょうく'],n:'どりょく。「どうりょく」は動力。',kr:'努 노 → ど（짧게）'}
   ]},
 { id:'onkun', name:'音読み？ 訓読み？', kr:'음독일까? 훈독일까?',
   tip:{ jp:'漢字1字に送りがなが付いていたら、まず訓読み。送りがなで読み方が決まる。2字の熟語は音読みが多いが、「場所・小型・手紙」のように訓読みが入るものもある。',
         kr:'한 글자 + 오쿠리가나 → 먼저 훈독. 오쿠리가나가 읽는 법을 정한다. 두 글자 숙어는 음독이 많지만, 훈독이 섞인 말도 있다.',
         ex:['生<b>える</b> はえる ／ 生<b>まれる</b> うまれる ／ 生<b>活</b> せいかつ','下<b>る</b> くだる ／ 下<b>がる</b> さがる ／ 下<b>りる</b> おりる','場所 = <b>ば</b>（訓）＋しょ（音）'] },
   items:[
    {f:'yomi',k:'生える',s:'庭に雑草がたくさん<u>生えて</u>いる。',o:['はえて','うえて','いきて','はいて'],n:'はえて。草・毛・歯が出てくるのは「生える」。生まれる・生きる・生活（せいかつ）も同じ「生」。',kr:'풀·털·이가 나다 = 生える(はえる)'},
    {f:'yomi',k:'明ける',s:'夜が<u>明けて</u>、空が明るくなってきた。',o:['あけて','あかけて','あきて','ひらけて'],n:'あけて。夜が明ける・年が明ける。明るい（あかるい）・説明（せつめい）も同じ字。',kr:'날이 새다 = 夜が明ける(あける)'},
    {f:'hyoki',k:'もちいる',s:'この方法を<u>もちいて</u>、問題を解いてください。',o:['用いて','使いて','持いて','率いて'],n:'もちいる＝用いる。「用」の音読みは「よう」（用事・利用）。「使う」は「使って」になる。「率いる」はひきいる。',kr:'もちいる = 用いる（이용하다）'},
    {f:'hyoki',k:'ささえる',s:'父は一人で家族の生活を<u>ささえて</u>きた。',o:['支えて','仕えて','指えて','差えて'],n:'ささえる＝支える。「仕える」はつかえる。音読みは「し」（支店 してん）。',kr:'ささえる = 支える（지탱하다·부양하다）'},

<script>
const $=id=>document.getElementById(id);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function prep(it){ const p=shuffle(it.o.map((o,i)=>({o,a:i===0}))); return Object.assign({},it,{opts:p.map(x=>x.o),ans:p.findIndex(x=>x.a)}); }
const kName=it=>it.c||it.k.replace(/[①②]/,'');
const chipText=it=> it.f==='yomi' ? `${kName(it)}　${it.o[0]}` : it.f==='hyoki' ? `${kName(it)} → ${it.o[0]}` : kName(it);

// 前回の「のびしろ」を覚えておく（この端末・このブラウザだけ）
const LS='n3_yomifuku_nobi';
function loadNobi(){ try{ return JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){ return {}; } }
function saveNobi(o){ try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){} }

let S=null, seq=[], pos=0, log=[], retry=false, inRun=false;

  inRun=false; S=null;

    ${SETS.map(s=>`<div class="setcard"><h2><span class="n">${s.label}</span>${s.title}<small>32問・約15分</small></h2>
      <ol>${s.rounds.map((r,ri)=>`<li><span class="no">${ri+1}</span>${r.name}<span class="k">${r.kr}</span></li>`).join('')}</ol>
      <button class="btn primary wide" data-s="${s.n}">${s.label} をはじめる</button>
      ${(nobi[s.n]||[]).length?`<button class="again" data-r="${s.n}">前回ののびしろ ${nobi[s.n].length}問だけ もう一度</button>`:''}
    </div>`).join('')}
  </div>`;
  $('stage').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>run(+b.dataset.s,false));
  $('stage').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>run(+b.dataset.r,true));
  scrollTo(0,0);
}
function run(n, isRetry){
  S=SETS.find(s=>s.n===n); retry=isRetry; seq=[]; log=[]; pos=0; inRun=true;
  if(isRetry){
    const keys=loadNobi()[n]||[];
    S.rounds.forEach((r,ri)=>r.items.forEach((it,i)=>{ if(keys.includes(it.k)) seq.push({t:'q',r:ri,it:prep(it)}); }));
  } else {
    S.rounds.forEach((r,ri)=>{ seq.push({t:'cover',r:ri}); r.items.forEach(it=>seq.push({t:'q',r:ri,it:prep(it)})); });
  }
  $('prog').classList.remove('hidden'); $('ctrl').classList.remove('hidden');
  render();
}
function qTotal(){ return seq.filter(x=>x.t==='q').length; }
function render(){
  const sl=seq[pos], r=S.rounds[sl.r];
  const done=seq.slice(0,pos).filter(x=>x.t==='q').length;
  $('progBar').style.width=(done/qTotal()*100)+'%';
  $('nextBtn').disabled=false;
  if(sl.t==='cover'){
    $('cnt').textContent=`${S.label} ROUND ${sl.r+1}/4`;
    $('nextBtn').textContent='はじめる →';
    $('stage').innerHTML=`<div class="cover"><div class="rno">ROUND ${sl.r+1} ／ 4</div><h2>${r.name}</h2><div class="krn">${r.kr}</div>
      <div class="kotsu"><div class="lab">得点のコツ　점수 따는 요령</div><div class="jp">${r.tip.jp}</div><div class="kr">${r.tip.kr}</div>
      <ul>${r.tip.ex.map(e=>`<li>${e}</li>`).join('')}</ul></div></div>`;
  } else {
    const it=sl.it;
    $('cnt').textContent=`${done+1} / ${qTotal()}`;
    $('nextBtn').textContent= pos===seq.length-1 ? '結果を見る →' : '次へ →';
    $('nextBtn').disabled=!sl.done;
    const long = it.f==='yoho' || it.opts.some(o=>o.length>9);
    $('stage').innerHTML=`<div class="qtag">${retry?'もう一度 · ':''}${r.name}　${FMT[it.f]}</div><div class="inst">${INST[it.f]}</div>
      ${it.f==='yoho'?`<div class="word">${it.s}</div>`:`<div class="sent">${it.s.replace('（　　）','（<span style="display:inline-block;min-width:60px"></span>）')}</div>`}
      <div class="choices">${it.opts.map((o,i)=>`<button class="choice ${long?'long':''}" data-i="${i}"><span class="no">${i+1}</span><span>${o}</span></button>`).join('')}</div>
      <div id="fb"></div>`;
    $('stage').querySelectorAll('.choice').forEach(c=>c.onclick=()=>answer(+c.dataset.i));
    if(sl.done) paint();
  }
  scrollTo(0,0);
}
function answer(i){
  const sl=seq[pos]; if(sl.done) return;
  sl.done=true; sl.sel=i; log.push({r:sl.r, it:sl.it, ok:i===sl.it.ans});
  paint(); $('nextBtn').disabled=false;
  $('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function paint(){
  const sl=seq[pos], it=sl.it, ok=sl.sel===it.ans;
  $('stage').querySelectorAll('.choice').forEach(c=>{ const i=+c.dataset.i; c.classList.toggle('correct',i===it.ans); c.classList.toggle('wrong',i===sl.sel&&!ok); });
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><div class="h">${ok?'○ そのとおり！':'のびしろ発見！ 正しくは「'+it.opts[it.ans]+'」'}</div>${it.n}<span class="k">${it.kr}</span></div>`;
}
function next(){ if(pos<seq.length-1){ pos++; render(); } else result(); }

function result(){
  inRun=false;
  $('prog').classList.add('hidden'); $('ctrl').classList.add('hidden'); $('cnt').textContent='';
  const ok=log.filter(x=>x.ok).length, nobi=log.filter(x=>!x.ok).map(x=>x.it);
  const store=loadNobi(); store[S.n]=nobi.map(it=>it.k); saveNobi(store);
  const rounds = retry ? '' : `<div class="rounds">${S.rounds.map((r,ri)=>{ const L=log.filter(x=>x.r===ri); const k=L.filter(x=>x.ok).length; return `<div class="rd"><div class="t">${ri+1}. ${r.name}</div><div class="v ${k===L.length?'full':''}">${k} / ${L.length}</div></div>`; }).join('')}</div>`;
  $('stage').innerHTML=`<div class="res"><h2>${S.title}${retry?'（もう一度）':''} おつかれさま！</h2>
    <div class="krs">○ ${ok} / ${log.length}　·　수고했어요! 아래 단어를 한 번 더 보면 완성!</div>
    ${rounds}
    ${nobi.length?`<div class="nobi"><div class="t">のびしろポイント<span>누르면 해설 — 모의고사 전에 한 번 더</span></div>
      <div class="nchips">${nobi.map((it,j)=>`<button class="nchip" data-j="${j}">${chipText(it)}</button>`).join('')}</div></div>`
      :`<div class="great">全部 ○！ この調子で金曜日の模試へ！<br><span style="font-size:14px;color:var(--kr)">전부 정답! 이 기세로 금요일 모의고사로!</span></div>`}
    <div class="rbtns">
      ${nobi.length?`<button class="btn primary wide" id="againBtn">のびしろ ${nobi.length}問だけ もう一度</button>`:''}
      <button class="btn wide" id="copyBtn">結果をコピー（카카오로 보내기）</button>
      <span class="copied hidden" id="copied"></span>
      <button class="btn wide" id="backBtn">最初に戻る</button>
    </div></div>`;
  $('stage').querySelectorAll('.nchip').forEach(b=>b.onclick=()=>explain(nobi[+b.dataset.j]));
  if(nobi.length) $('againBtn').onclick=()=>run(S.n,true);
  $('copyBtn').onclick=()=>copyResult(ok,log.length,nobi);
  $('backBtn').onclick=start;
  scrollTo(0,0);
}
function explain(it){
  $('ex-title').textContent=chipText(it);
  $('ex-body').innerHTML=`<div class="s">${it.f==='yoho'?'<b>'+it.s+'</b>':it.s.replace('（　　）','（<span class="a">'+it.o[0]+'</span>）')}${it.f==='yoho'?'<br>○ <span class="a">'+it.o[0]+'</span>':''}</div>${it.n}<span class="k">${it.kr}</span>`;
  $('explain').classList.remove('hidden');
}
function copyResult(ok,total,nobi){
  const txt=`[得点アップ 読み方＆副詞チャレンジ ${S.title}${retry?' もう一度':''}]\n결과: ${ok}/${total}\n🔁 다시 볼 것: ${nobi.length?nobi.map(chipText).join(', '):'없음 — 전부 정답!'}`;
  const done=()=>{ $('copied').textContent='✓ 복사됨 — 카카오에 붙여넣기'; $('copied').classList.remove('hidden'); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>box(txt)); else box(txt);
}
function box(txt){ let ta=$('copyBox'); if(!ta){ ta=document.createElement('textarea'); ta.id='copyBox'; ta.readOnly=true; $('stage').appendChild(ta); } ta.value=txt; ta.focus(); ta.select(); $('copied').textContent='↓ 길게 눌러 복사 — 카카오에 붙여넣기'; $('copied').classList.remove('hidden'); }
function leaveOk(){ if(inRun) return confirm('途中の答えは消えます。一覧に戻りますか？\n중간 답이 사라집니다. 목록으로 돌아갈까요?'); return true; }
$('nextBtn').onclick=next;
$('ex-close').onclick=()=>$('explain').classList.add('hidden');
start();
</script>
</body>
</html>

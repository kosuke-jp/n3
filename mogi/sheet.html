<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>N3 解答用紙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+KR:wght@400&display=swap">
<style>
/*
VOICE: 試験会場のマークシート。静かで、迷わず押せる。
IDEA: JLPTの解答用紙をスマホの幅に合わせたもの。問題番号と丸い選択肢が縦に並ぶ。
PICTURE: マークの列そのもの。押した丸が塗りつぶされる。
COLOUR and TYPE: 白い紙、墨、マークシートの薄い赤、選んだ丸は墨で塗る。☆だけ黄色。Zen Kaku Gothic New。
LAYOUT: 上に区分のタブと進み具合、下にマークの列、最後に送るボタン。
*/
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141619);--ink:light-dark(#1b1b1b,#ececec);--mute:light-dark(#6b6b6b,#a3a3a3);--line:light-dark(#f0c9c3,#4a2f2b);--paper:light-dark(#fff7f5,#1d1a1a);--star:#f2b705;--soft:light-dark(#f4f4f4,#202328)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Zen Kaku Gothic New",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.ko{font-family:"Noto Sans KR",sans-serif;color:var(--mute);font-size:13px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 0}
h1{font-size:19px;margin:0;line-height:1.3}
.meta{display:flex;gap:8px;align-items:center;margin:6px 0 8px;flex-wrap:wrap}
.meta input{font:inherit;font-size:16px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:9em}
.prog{margin-left:auto;font-size:14px;color:var(--mute);white-space:nowrap}
.tabs{display:flex;gap:0;overflow-x:auto}
.tabs button{flex:1;font:inherit;font-size:15px;font-weight:700;color:var(--mute);background:none;border:0;border-bottom:3px solid transparent;padding:10px 6px;min-height:44px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs small{font-weight:500;font-size:12px;display:block}
main{max-width:560px;margin:0 auto;padding:6px 12px 40px}
.help{font-size:14px;color:var(--mute);margin:10px 2px}
.help b{color:var(--star)}
h2{font-size:16px;margin:20px 2px 6px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:13px;color:var(--mute);font-weight:500}
.sheet{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:2.6em minmax(0,1fr) 44px 44px;align-items:center;border-top:1px solid var(--line);padding:4px 6px 4px 8px}
.row:first-child{border-top:0}
.no{font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.ex .no{color:var(--mute);font-weight:500;font-size:14px}
.ch{display:flex;gap:6px}
.ch button{width:44px;height:44px;border-radius:50%;border:1.8px solid #d98a7e;background:var(--bg);color:#c0645a;font:inherit;font-size:16px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.ch button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.st,.mm{width:40px;height:40px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute);border-radius:8px}
.st.on{color:var(--star)}
.mm.on{color:var(--ink)}
.memo{grid-column:1/-1;padding:4px 0 6px}
.memo input{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.send{margin-top:28px;background:var(--soft);border-radius:12px;padding:16px}
.send h3{margin:0 0 6px;font-size:17px}
.send p{margin:0 0 10px;font-size:14px;color:var(--mute)}
.big{width:100%;font:inherit;font-size:17px;font-weight:700;border:0;border-radius:12px;background:var(--ink);color:var(--bg);min-height:52px;cursor:pointer}
.sub{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:44px;margin-top:8px;cursor:pointer}
textarea{width:100%;height:180px;font:13px/1.5 ui-monospace,monospace;border:1.5px solid var(--line);border-radius:8px;padding:8px;margin-top:10px;background:var(--bg);color:var(--ink)}
.msg{font-size:14px;margin-top:8px;min-height:1.4em}
button:focus-visible,input:focus-visible{outline:3px solid #5b8def;outline-offset:2px}
</style>
</head>
<body>
<header>
 <h1>JLPT N3 解答用紙 <span class="ko">답안지</span></h1>
 <div class="meta"><input id="name" placeholder="名前" autocomplete="off"><span class="prog" id="prog">0 / 102</span></div>
 <nav class="tabs" id="tabs"></nav>
</header>
<main>
 <p class="help">問題のファイルを見ながら、答えの番号を押してください。自信がない問題は <b>☆</b>、気になったことは ✎ でメモ。答えは自動で保存されます。<br><span class="ko">자신 없는 문제는 ☆, 메모는 ✎. 답은 자동 저장됩니다.</span></p>
 <div id="body"></div>
 <section class="send">
  <h3>先生に送る <span class="ko">선생님께 보내기</span></h3>
  <p>全部終わったら「答えをコピー」を押して、カカオトークに貼ってください。</p>
  <button class="big" id="copy" type="button">答えをコピー</button>
  <button class="sub" id="show" type="button">コピーできないときは、ここを押して表示</button>
  <div class="msg" id="msg"></div>
  <div id="out"></div>
  <button class="sub" id="reset" type="button">ぜんぶ消して最初から</button>
 </section>
</main>
<script>
{
// 問題の構成（JLPT N3 公式サンプル）。[区分キー, 表示名, [[問題名, 最初の番号, 数, 選択肢の数], ...]]
const SEC=[
 ['V','文字・語彙','문자·어휘',[['問題1',1,8,4],['問題2',9,6,4],['問題3',15,11,4],['問題4',26,5,4],['問題5',31,5,4]]],
 ['G','文法・読解','문법·독해',[['問題1',1,13,4],['問題2',14,5,4],['問題3',19,5,4],['問題4',24,4,4],['問題5',28,6,4],['問題6',34,4,4],['問題7',38,2,4]]],
 ['L','聴解','청해',[['問題1',1,6,4],['問題2',1,6,4],['問題3',1,3,4],['問題4',1,4,3],['問題5',1,9,3]]]
];
// 聴解は問題ごとに番号が1から始まるので、キーを「L問題番号-番号」にする
const items=[];
SEC.forEach(([k,name,ko,parts])=>parts.forEach(([p,start,n,c],pi)=>{for(let i=0;i<n;i++){const no=start+i;items.push({sec:k,part:p,pi,no,c,id:k==='L'?`L${pi+1}-${no}`:`${k}${no}`})}}));
const KEY='n3-official-sheet-v1';
let st={name:'',a:{},s:{},m:{}},tab='V';
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.a)st=v}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('name').value=st.name||'';
$('name').addEventListener('input',e=>{st.name=e.target.value;save()});
function prog(){const n=items.filter(x=>st.a[x.id]).length;$('prog').textContent=`${n} / ${items.length}`;
 $('tabs').innerHTML=SEC.map(([k,name])=>{const t=items.filter(x=>x.sec===k),d=t.filter(x=>st.a[x.id]).length;return `<button type="button" data-t="${k}" class="${tab===k?'on':''}">${name}<small>${d}/${t.length}</small></button>`}).join('')}
function render(){
 const s=SEC.find(x=>x[0]===tab);
 $('body').innerHTML=s[3].map(([p,start,n,c],pi)=>{
  const rows=items.filter(x=>x.sec===tab&&x.pi===pi);
  return `<h2>${p}<small>${tab==='L'?'1':start}〜${tab==='L'?n:start+n-1}</small></h2><div class="sheet">${rows.map(x=>`
   <div class="row" data-id="${x.id}"><span class="no">${x.no}</span>
   <span class="ch">${Array.from({length:x.c},(_,i)=>`<button type="button" data-v="${i+1}" class="${st.a[x.id]==i+1?'on':''}" aria-label="${x.no}番 ${i+1}">${i+1}</button>`).join('')}</span>
   <button type="button" class="st ${st.s[x.id]?'on':''}" aria-label="自信がない">${st.s[x.id]?'★':'☆'}</button>
   <button type="button" class="mm ${st.m[x.id]?'on':''}" aria-label="メモ">✎</button>
   ${st.m[x.id]!=null&&st.m[x.id]!==false?`<div class="memo"><input value="${esc(st.m[x.id]||'')}" placeholder="メモ（例：2と3でまよった）"></div>`:''}</div>`).join('')}</div>`}).join('');
 prog();
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;render();scrollTo(0,0)});
$('body').addEventListener('click',e=>{
 const row=e.target.closest('.row');if(!row)return;const id=row.dataset.id;const b=e.target.closest('button');if(!b)return;
 if(b.dataset.v){const v=+b.dataset.v;st.a[id]=st.a[id]===v?0:v;if(!st.a[id])delete st.a[id];save();row.querySelectorAll('.ch button').forEach(x=>x.classList.toggle('on',+x.dataset.v===st.a[id]));prog();return}
 if(b.classList.contains('st')){st.s[id]=!st.s[id];if(!st.s[id])delete st.s[id];save();b.classList.toggle('on',!!st.s[id]);b.textContent=st.s[id]?'★':'☆';return}
 if(b.classList.contains('mm')){if(row.querySelector('.memo')){if(!st.m[id])delete st.m[id];render();return}st.m[id]=st.m[id]||'';save();render();const i=document.querySelector(`.row[data-id="${id}"] .memo input`);if(i)i.focus();}
});
$('body').addEventListener('input',e=>{const row=e.target.closest('.row');if(!row||!e.target.closest('.memo'))return;st.m[row.dataset.id]=e.target.value;save()});
function text(){
 const L=[];const d=new Date();
 L.push('【JLPT N3 公式サンプル 解答】');
 L.push(`名前：${st.name||'（未記入）'}　${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`);
 SEC.forEach(([k,name,ko,parts])=>{L.push('');L.push(`■ ${name}`);parts.forEach(([p,start,n],pi)=>{const r=items.filter(x=>x.sec===k&&x.pi===pi);L.push(`${p}：`+r.map(x=>(st.a[x.id]||'-')+(st.s[x.id]?'☆':'')).join(' '))})});
 const stars=items.filter(x=>st.s[x.id]).map(x=>lab(x));
 L.push('');L.push('☆（自信がない）：'+(stars.length?stars.join('、'):'なし'));
 const memos=items.filter(x=>st.m[x.id]).map(x=>`・${lab(x)}：${st.m[x.id]}`);
 if(memos.length){L.push('メモ：');memos.forEach(m=>L.push(m))}
 const done=items.filter(x=>st.a[x.id]).length;L.push(`（${done}/${items.length}問 回答）`);
 L.push('#CODE '+SEC.map(([k])=>k+':'+items.filter(x=>x.sec===k).map(x=>(st.a[x.id]||0)+(st.s[x.id]?'*':'')).join('')).join('|'));
 return L.join('\n');
}
function lab(x){return x.sec==='L'?`聴解${x.part}-${x.no}`:`${x.sec==='V'?'文字語彙':'文法読解'}${x.no}`}
$('copy').addEventListener('click',async()=>{const t=text();try{await navigator.clipboard.writeText(t);$('msg').textContent='コピーしました。カカオトークに貼って送ってください。'}catch(e){showText(t)}});
$('show').addEventListener('click',()=>showText(text()));
function showText(t){$('out').innerHTML=`<textarea readonly>${esc(t)}</textarea>`;const a=$('out').querySelector('textarea');a.focus();a.select();$('msg').textContent='長押しして全部選び、コピーしてください。'}
$('reset').addEventListener('click',e=>{const b=e.currentTarget;if(b.dataset.sure){st={name:st.name,a:{},s:{},m:{}};save();b.dataset.sure='';b.textContent='ぜんぶ消して最初から';$('out').innerHTML='';$('msg').textContent='';render()}else{b.dataset.sure='1';b.textContent='本当に消す場合は、もう一度押してください'}});
render();
}
</script>
</body>
</html>

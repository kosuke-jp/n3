<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="第3回模試 ふりかえりチャレンジ">
<meta property="og:description" content="모의고사에서 헷갈렸던 부분에 다시 도전! 20문제 · 바로 정답 확인 + 해설">
<meta property="og:type" content="website">
<meta name="description" content="모의고사에서 헷갈렸던 부분에 다시 도전! 20문제 · 바로 정답 확인 + 해설">
<title>第3回模試 ふりかえりチャレンジ｜N3</title>
<style>
:root{
  --ink:#1a1a1a; --accent:#3b82f6; --accent2:#2f6fd6; --bg2:#faf9f6; --bd:#e2e0d8; --bd2:#d0cec6;
  --mut:#7a7a7a; --ok:#166534; --okbg:#f0fdf4; --okbd:#86efac;
  --ng:#dc2626; --ngbg:#fef2f2; --ngbd:#fca5a5; --amber:#f59e0b; --ambg:#fffbeb; --ambd:#fde68a;
  --kr:#1e40af; --krbg:#eff6ff; --krbd:#bfdbfe;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Hiragino Sans","Noto Sans CJK JP","Noto Sans CJK KR","Noto Sans JP","Malgun Gothic",sans-serif;
  color:var(--ink);background:#e9eaee;display:flex;align-items:center;justify-content:center;min-height:100vh}
#app{width:min(1280px,96vw);aspect-ratio:16/9;background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.22);position:relative;display:flex;flex-direction:column}
.hidden{display:none!important}

#bar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--bd);background:var(--bg2)}
#bar .brand{font-weight:900;font-size:17px}
#bar .brand .a{color:var(--accent)}
#bar .rng{font-size:13px;font-weight:700;color:var(--kr);background:var(--krbg);border:1px solid var(--krbd);border-radius:14px;padding:4px 11px}
#bar .sp{flex:1}
#bar .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;color:#374151;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:4px 12px}
#bar .timer.run{color:var(--accent)}
#bar .timer.low{color:#b45309;border-color:var(--ambd)}
#bar .timer.end{color:#92700e;background:var(--ambg);border-color:var(--ambd)}
#bar .qcount{font-size:14px;font-weight:800;color:#555}

#dots{height:34px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid var(--bd)}
#dots .d{width:11px;height:11px;border-radius:50%;background:var(--bd2);transition:.15s}
#dots .d.on{background:var(--accent);transform:scale(1.3)}
#dots .d.done{background:#9dbef7}
#dots .d.ok{background:var(--ok)} #dots .d.ng{background:var(--ng)}
#dots .gap{width:10px}

#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 44px;position:relative;overflow:auto}

.start{text-align:center;max-width:860px}
.start h1{font-size:36px;font-weight:900;margin-bottom:8px}
.start h1 .a{color:var(--accent)}
.start .sub{color:#444;font-size:17px;margin-bottom:6px}
.start .subk{color:var(--kr);font-size:14px;margin-bottom:26px}
.start .meta{display:flex;gap:12px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
.start .meta span{border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;color:#444;background:var(--bg2)}
.opts-toggle{margin-top:20px;font-size:14px;color:#444;display:flex;gap:10px;align-items:center;justify-content:center}
.opts-toggle label{display:flex;gap:7px;align-items:center;cursor:pointer;user-select:none}
.opts-toggle input{width:17px;height:17px}

.qwrap{width:100%;max-width:1000px}
.qtag{font-size:14px;font-weight:800;letter-spacing:1px;color:var(--accent);text-align:center}
.inst{font-size:15px;color:var(--mut);text-align:center;margin-top:4px}
.sent{font-size:34px;font-weight:600;text-align:center;margin:26px 0 30px;line-height:1.6}
.sent u{text-decoration:none;border-bottom:3px solid var(--ink);padding:0 2px}
.sent .blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--ink);margin:0 4px}
.sent .who{font-size:22px;color:var(--mut);display:block;margin-bottom:4px}
.word{font-size:54px;font-weight:900;text-align:center;margin:18px 0 22px;letter-spacing:3px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.choices.one{grid-template-columns:1fr;gap:10px}
.choice{display:flex;align-items:center;gap:14px;border:2px solid var(--bd);border-radius:12px;padding:14px 18px;cursor:pointer;font-size:25px;font-weight:600;background:#fff;transition:.12s}
.choices.one .choice{font-size:21px;padding:11px 18px}
.choice:hover{border-color:#9dbef7;background:#f7faff}
.choice .no{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#666}
.choice.sel{border-color:var(--accent);background:#eff6ff}
.choice.sel .no{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.correct{border-color:var(--okbd);background:var(--okbg)}
.choice.correct .no{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{border-color:var(--ngbd);background:var(--ngbg)}
.choice.wrong .no{background:var(--ng);border-color:var(--ng);color:#fff}
.qnote{margin-top:16px;font-size:16px;line-height:1.6;background:var(--okbg);border:1px solid var(--okbd);border-radius:10px;padding:10px 14px}
.qnote .k{display:block;color:var(--kr);font-size:14px}

#ctrl{height:70px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-top:1px solid var(--bd);background:var(--bg2)}
.btn{border:1px solid var(--bd2);background:#fff;color:#444;font-size:15px;font-weight:700;padding:11px 22px;border-radius:10px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}.btn:disabled:hover{border-color:var(--bd2);color:#444}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);color:#fff}
.btn.grade{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.grade:hover{background:#12532b;color:#fff}
.btn.big{font-size:20px;padding:15px 40px}

.result{width:100%;max-width:1100px}
.rtop{display:flex;align-items:center;gap:24px;margin-bottom:8px}
.scorebig{flex:none;text-align:center;border:3px solid var(--accent);border-radius:16px;padding:12px 26px}
.scorebig .n{font-size:44px;font-weight:900;line-height:1;color:var(--accent)}
.scorebig .n small{font-size:24px;color:#9aa3af}
.scorebig .p{font-size:15px;font-weight:800;color:#374151;margin-top:4px}
.secs{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sec{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:var(--bg2)}
.sec .t{font-size:12.5px;font-weight:800;color:#555}
.sec .v{font-size:22px;font-weight:900}
.sec .v.full{color:var(--ok)} .sec .v.part{color:var(--accent)}
.rlist{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;max-height:300px;overflow:auto;padding-right:6px}
.ritem{display:flex;align-items:center;gap:10px;font-size:14.5px;border-bottom:1px solid #eee;padding:3px 2px;cursor:pointer}
.ritem:hover{background:#f7faff}
.ritem .qn{flex:none;width:26px;color:var(--mut);font-weight:700;font-size:13px;text-align:right}
.ritem .mk{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.ritem .mk.o{background:var(--ok)} .ritem .mk.x{background:var(--ng)}
.ritem .kj{flex:none;width:150px;font-weight:800;white-space:nowrap}
.ritem .co{color:var(--ok);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ritem .ua{color:var(--ng);font-size:13px;margin-left:auto;white-space:nowrap}
.ritem .src{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;border:1px solid var(--krbd);color:var(--kr);background:var(--krbg)}
.ritem .src.rel{border-color:var(--bd2);color:#666;background:#f4f4f2}
.focus{margin-top:8px;border-top:1px dashed var(--bd);padding-top:8px}
.ftitle{font-size:14px;font-weight:800;color:#92700e}
.ftitle .fkr{font-size:12px;color:var(--kr);font-weight:600;margin-left:8px}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fchip{border:1px solid var(--ambd);background:var(--ambg);color:#92700e;font-weight:700;font-size:13px;padding:7px 13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
.fchip:hover{border-color:var(--amber)}
.fchip .arw{color:var(--accent);font-weight:800}
.rbtns{display:flex;gap:12px;margin-top:8px;justify-content:flex-end}
.copied{color:var(--ok);font-weight:700;font-size:14px;align-self:center;margin-right:auto}

#explain{position:absolute;inset:0;background:rgba(20,20,25,.45);display:flex;align-items:center;justify-content:center;z-index:60}
.ex-card{width:78%;max-width:800px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ex-head{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:var(--ambg);border-bottom:1px solid var(--ambd)}
.ex-head #ex-title{font-size:20px;font-weight:900;color:#92700e}
#ex-close{background:#fff;border:1px solid var(--bd2);border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;color:#666;font-family:inherit}
#ex-body{padding:20px}
#ex-body .sk{font-size:18px;line-height:1.6;margin-bottom:14px}
#ex-body .skr{display:block;color:var(--kr);font-weight:600;font-size:14px;margin-top:4px}
#ex-body .sex{font-size:19px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px 15px;margin-bottom:12px;line-height:1.9}
#ex-body .sex .ok{color:var(--ok);font-weight:800}
#ex-body .sex .ng{color:var(--ng);font-weight:800}
#ex-body .stip{font-size:14px;color:#444;background:var(--okbg);border:1px solid var(--okbd);border-radius:9px;padding:10px 13px;line-height:1.6}
@media (max-width:820px), (orientation:portrait){
  body{display:block;background:#fff}
  #app{width:100%;aspect-ratio:auto;min-height:100vh;min-height:100dvh;border-radius:0;box-shadow:none}
  #bar{padding:0 12px;gap:8px;height:50px}
  #bar .brand{font-size:15px}
  #bar .rng{display:none}
  #dots{gap:5px;height:28px;flex-wrap:wrap}
  #dots .d{width:9px;height:9px}
  #dots .gap{width:4px}
  #stage{padding:14px 14px;align-items:flex-start}
  .start{padding-top:24px}
  .start h1{font-size:26px}
  .sent{font-size:22px;margin:16px 0 18px}
  .sent .who{font-size:15px}
  .sent .blank{min-width:70px}
  .word{font-size:38px;margin:12px 0 14px}
  .choices{grid-template-columns:1fr;gap:9px}
  .choice{font-size:19px;padding:11px 14px}
  .choices.one .choice{font-size:16px;padding:10px 12px}
  .choice .no{width:28px;height:28px;font-size:14px}
  .inst{font-size:13px}
  #ctrl{position:sticky;bottom:0;height:auto;padding:10px 12px;gap:8px}
  #ctrl .btn{padding:10px 14px;font-size:14px}
  .rtop{flex-direction:column;align-items:stretch;gap:10px}
  .secs{grid-template-columns:1fr 1fr}
  .rlist{grid-template-columns:1fr;max-height:none}
  .ritem .kj{width:auto;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .ritem{flex-wrap:wrap;row-gap:2px}
  .ritem .ua{flex-basis:100%;padding-left:58px;margin-left:0;white-space:normal}
  .rbtns{flex-wrap:wrap}
  .ex-card{width:94%}
  #explain{position:fixed}
  #ex-body .sex{font-size:16px}
}
@media print{
  body{background:#fff}
  #app{box-shadow:none;width:100%;aspect-ratio:auto}
  #ctrl,#bar .timer{display:none}
  .rlist{max-height:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="brand">ふりかえりチャレンジ <span class="a">·</span></span>
    <span class="rng" id="rng">第3回模試から</span>
    <span class="sp"></span>
    <span class="qcount hidden" id="qcount">1 / 20</span>
    <span class="timer hidden" id="timer">10:00</span>
  </div>
  <div id="dots" class="hidden"></div>

  <div id="stage">
    <div class="start" id="startScreen">
      <h1>第3回模試 <span class="a">ふりかえりチャレンジ</span></h1>
      <div class="sub">模試で迷ったところに、もう一度チャレンジ！ 20問</div>
      <div class="subk">모의고사에서 헷갈렸던 부분에 다시 도전! 20문제</div>
      <div class="meta">
        <span>文字・語彙 12問</span><span>文法 8問</span><span>4択</span><span>10分</span>
      </div>
      <button class="btn primary big" id="startBtn">はじめる</button>
      <div class="opts-toggle">
        <label><input type="checkbox" id="useTimer" checked> 10分タイマーを使う</label>
        <span style="color:#c9c7bf">|</span>
        <span style="color:var(--mut);font-size:13px">数字キー 1–4＝選択　／　← → 移動</span>
      </div>
    </div>
    <div class="qwrap hidden" id="qScreen"></div>
    <div class="result hidden" id="rScreen"></div>
  </div>

  <div id="ctrl" class="hidden">
    <button class="btn" id="prevBtn">← 前へ</button>
    <div style="display:flex;gap:12px">
      <button class="btn" id="restartBtn">最初に戻る</button>
      <button class="btn primary" id="nextBtn">次へ →</button>
      <button class="btn grade hidden" id="gradeBtn">答え合わせ</button>
      <button class="btn primary hidden" id="toResultBtn">結果に戻る</button>
    </div>
  </div>

  <div id="explain" class="hidden">
    <div class="ex-card">
      <div class="ex-head"><span id="ex-title"></span><button id="ex-close">✕</button></div>
      <div id="ex-body"></div>
    </div>
  </div>
</div>

<script>
// ans は並べ替え前の正解位置（すべて0）。表示時に shuffleItems() で選択肢を混ぜる。
// src: 'moshi'＝模試の誤答を形を変えて出題 ／ 'rel'＝関連問題
const SECTIONS = {
  s1:{name:'もんだい1　漢字読み', inst:'＿＿＿のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。'},
  s2:{name:'もんだい2　漢字表記', inst:'＿＿＿のことばを漢字で書くとき、最もよいものを、1・2・3・4から一つえらびなさい。'},
  s3:{name:'もんだい3　文脈規定', inst:'（　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。'},
  s4:{name:'もんだい4　言い換え', inst:'＿＿＿に意味が最も近いものを、1・2・3・4から一つえらびなさい。'},
  s5:{name:'もんだい5　用法', inst:'つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。'},
  s6:{name:'もんだい6　文法', inst:'つぎの文の（　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。'},
};
const B = '<span class="blank"></span>';
const ITEMS = [
  {sec:'s1', etype:'yomi',  src:'rel',   key:'豪雨', sent:'昨日の夜、ひどい<u>豪雨</u>で電車が止まった。', opts:['ごうう','こうう','ごうあめ','こうあめ'], ans:0,
   note:'「豪」は「ごう」と濁る（豪雨・豪華・強豪）。', kr:'豪는 ごう로 탁음.'},
  {sec:'s1', etype:'yomi',  src:'moshi', key:'豪華', sent:'この部屋は思ったより<u>豪華</u>だった。', opts:['ごうか','ごか','こうか','こうが'], ans:0,
   note:'ごうか。「ごか」は長音が落ちている。', kr:'장음 ごう를 놓치지 않기.'},
  {sec:'s2', etype:'hyoki', src:'moshi', key:'もちいる', sent:'新しい方法を<u>もちいて</u>、問題を解いた。', opts:['用いて','導いて','率いて','使いて'], ans:0,
   note:'もちいる＝用いる。導く（みちびく）・率いる（ひきいる）。「使う」は「使って」。', kr:'もちいる＝用いる(사용하다).'},
  {sec:'s2', etype:'hyoki', src:'moshi', key:'ささえる', sent:'母は働きながら家族を<u>ささえて</u>きた。', opts:['支えて','構えて','備えて','与えて'], ans:0,
   note:'ささえる＝支える。構える（かまえる）・備える（そなえる）・与える（あたえる）。', kr:'모두 〜える라서 오쿠리가나로는 구별 불가. 읽기로 판단.'},
  {sec:'s3', etype:'colloc', src:'rel',  key:'ぎっしり', sent:'箱の中には、お菓子が（'+B+'）入っていた。', opts:['ぎっしり','ぴったり','すっかり','しっかり'], ans:0,
   note:'箱に／予定が ぎっしり ⇔ サイズが／時間が ぴったり', kr:'ぎっしり＝빽빽이, ぴったり＝딱 맞게.'},
  {sec:'s3', etype:'colloc', src:'moshi', key:'生える', sent:'春になって、庭に草がたくさん（'+B+'）きた。', opts:['生えて','咲いて','枯れて','伸ばして'], ans:0,
   note:'草・毛・歯は「生える」、花は「咲く」。', kr:'풀이 나다＝草が生える.'},
  {sec:'s3', etype:'colloc', src:'moshi', key:'苦手', sent:'私は朝早く起きるのが（'+B+'）です。', opts:['苦手','緊張','迷惑','悪化'], ans:0,
   note:'「〜のが苦手だ」。緊張は「〜に緊張する」と使う。', kr:'〜のが苦手だ＝〜하는 것을 잘 못하다.'},
  {sec:'s3', etype:'colloc', src:'moshi', key:'限界', sent:'毎晩おそくまで残業が続いて、体力がもう（'+B+'）だ。', opts:['限界','回復','測定','我慢'], ans:0,
   note:'体力の限界。回復は良くなることなので合わない。', kr:'체력의 한계＝体力の限界.'},
  {sec:'s4', etype:'iikae', src:'moshi', key:'どなる', sent:'父は弟を<u>どなった</u>。', opts:['怒って大声を出した','大きな声で呼んだ','ていねいに注意した','長い時間話した'], ans:0,
   note:'どなる＝怒って大きな声を出す。「怒る」の部分まで合っているものを選ぶ。', kr:'どなる＝화내며 고함치다.'},
  {sec:'s4', etype:'iikae', src:'moshi', key:'明ける', sent:'長い夜がやっと<u>明けた</u>。', opts:['終わった','始まった','暗くなった','止まった'], ans:0,
   note:'明ける＝ある期間が終わる（夜が明ける・梅雨が明ける・年が明ける）。', kr:'밤이 새다＝夜が明ける.'},
  {sec:'s5', etype:'youhou', src:'moshi', key:'高まる', short:'期待が高まる', word:'高まる', opts:['新しい映画への期待が高まっている。','この町の人口が年々高まっている。','テストの点数が先月より高まった。','エレベーターで5階まで高まった。'], ans:0,
   note:'関心・期待・人気が 高まる ⇔ 人口が 増える ⇔ 点数が 上がる', kr:'高まる＝기분·정도가 높아지다. 수량은 増える.'},
  {sec:'s5', etype:'youhou', src:'moshi', key:'違反', short:'交通ルール違反', word:'違反', opts:['駐車禁止の場所に車を止めるのは、交通ルール違反だ。','計算に違反があったので、もう一度やり直した。','天気予報が違反して、午後から雨が降った。','彼の意見は私の考えと少し違反している。'], ans:0,
   note:'違反＝規則・法律・約束を守らないこと。計算の場合は「間違い」。', kr:'違反＝규칙 위반. 계산 실수는 間違い.'},
  {sec:'s6', etype:'kinou', src:'moshi', key:'〜に誘う', sent:'友だちに映画（'+B+'）誘われた。', opts:['に','が','で','と'], ans:0,
   note:'〜を（人）〜に誘う。誘う内容は「に」（食事に・映画に）。', kr:'〜에 초대하다/권하다＝〜に誘う.'},
  {sec:'s6', etype:'kinou', src:'moshi', key:'まで', sent:'この仕事が終わる（'+B+'）、ここで待っていてください。', opts:['まで','までに','あいだに','うちに'], ans:0,

   note:'聞くのは自分（学生）→ お〜する（謙譲語）。', kr:'내 동작＝お〜する.'},
  {sec:'s6', etype:'bunkei', src:'moshi', key:'〜でたまらない', sent:'明日の面接のことを考えると、私は心配（'+B+'）。', opts:['でたまらない','に違いない','とは限らない','わけではない'], ans:0,
   note:'〜でたまらない＝自分の気持ちがとても強い。〜に違いない＝根拠からの推量。', kr:'〜でたまらない＝〜해서 견딜 수 없다(내 감정).'},
  {sec:'s6', etype:'kinou', src:'moshi', key:'好きなだけ', sent:'疲れているなら、好きな（'+B+'）寝ていいよ。', opts:['だけ','こそ','まで','など'], ans:0,
   note:'好きなだけ＝好きな量を、好きなだけ。こそ＝一つを強調（今度こそ）。', kr:'好きなだけ＝원하는 만큼.'},
  {sec:'s6', etype:'kinou', src:'rel', key:'までに', sent:'レポートは来週の金曜日（'+B+'）出してください。', opts:['までに','まで','あいだ','ながら'], ans:0,
   note:'までに＝その時より前に一回する（期限）。', kr:'までに＝〜까지(기한).'},
  {sec:'s6', etype:'keigo', src:'rel', key:'いらっしゃる', sent:'<span class="who">（会社の受付で）</span>「部長は何時ごろ会社に（'+B+'）か。」', opts:['いらっしゃいます','まいります','うかがいます','おります'], ans:0,
   note:'来るのは部長（相手側の目上）→ 尊敬語「いらっしゃる」。まいる・うかがう・おるは自分側。', kr:'상대(윗사람)의 동작＝존경어.'},
  {sec:'s6', etype:'bunkei', src:'rel', key:'〜わけにはいかない', sent:'熱があるが、今日は大切な会議があるので、休む（'+B+'）。', opts:['わけにはいかない','ようがない','しかない','ことがある'], ans:0,
   note:'〜わけにはいかない＝（事情があって）〜できない。聴解もんだい5-6にも出た。', kr:'〜わけにはいかない＝〜할 수는 없다.'},
];

const ETYPE = {
  yomi:  {jp:'濁る・濁らない',   kr:'탁음 판단'},
  hyoki: {jp:'訓読み動詞の漢字', kr:'훈독 동사 한자'},
  colloc:{jp:'ことばの組み合わせ', kr:'함께 쓰는 말'},
  iikae: {jp:'意味の全体で言い換え', kr:'뜻 전체로 바꿔 말하기'},
  youhou:{jp:'使い方（用法）',   kr:'용법'},
  kinou: {jp:'似た機能語',       kr:'비슷한 기능어'},
  keigo: {jp:'敬語（誰の動作か）', kr:'경어(누구의 동작인가)'},
  bunkei:{jp:'決まった言い方',   kr:'정해진 표현'},
};
const STOCK = {
  yomi:`<div class="sk">漢語の読みは、濁るか・のばすかで別の語になる。<span class="skr">탁음·장음 하나로 다른 말이 된다.</span></div>
    <div class="sex"><span class="ok">○ ごうか（豪華）</span> ／ <span class="ng">× こうか・ごか</span>　　<span class="ok">○ ごうう（豪雨）</span></div>
    <div class="stip">声に出して読む。「濁るか／のばすか」を1字ずつ確かめる。</div>`,
  hyoki:`<div class="sk">訓読みの動詞は、送りがなが同じでも漢字が違う。読みと漢字をセットで覚える。<span class="skr">오쿠리가나가 같아도 한자가 다르다. 읽기와 한자를 세트로.</span></div>
    <div class="sex"><span class="ok">ささえる＝支える</span>　かまえる＝構える　そなえる＝備える　あたえる＝与える<br><span class="ok">もちいる＝用いる</span>　みちびく＝導く　ひきいる＝率いる</div>
    <div class="stip">「意味が近い漢字」ではなく「読み」で選ぶ。</div>`,
  colloc:`<div class="sk">意味は分かっていても、「何と一緒に使うか」で決まる。<span class="skr">뜻은 알아도 '무엇과 함께 쓰는가'로 정해진다.</span></div>
    <div class="sex"><span class="ok">草が 生える</span> ⇔ 花が 咲く　　<span class="ok">箱に ぎっしり</span> ⇔ サイズが ぴったり<br><span class="ok">〜のが 苦手だ</span> ⇔ 〜に 緊張する　　<span class="ok">体力の 限界</span></div>
    <div class="stip">単語は一語ではなく、組み合わせごと覚える。</div>`,
  iikae:`<div class="sk">意味の一部だけ合っている選択肢に注意。意味の全体が合っているものを選ぶ。<span class="skr">뜻의 일부만 맞는 선택지에 주의.</span></div>
    <div class="sex"><span class="ok">どなる＝怒って大声を出す</span> ／ <span class="ng">大きな声で呼ぶ（怒りがない）</span><br><span class="ok">明ける＝（期間が）終わる</span> ／ <span class="ng">止まる</span></div>
    <div class="stip">言い換えた語を元の文に入れて、意味が同じか確かめる。</div>`,
  youhou:`<div class="sk">下線の語を、近い語に置き換えて自然かどうか確かめる。<span class="skr">비슷한 말로 바꿔 넣어 자연스러운지 확인.</span></div>
    <div class="sex"><span class="ok">期待が 高まる</span>　人口が → 増える　点数が → 上がる<br><span class="ok">ルール 違反</span>　計算に → 間違い</div>
    <div class="stip">「増える？上がる？」と置き換えて、合わない文を外していく。</div>`,
  kinou:`<div class="sk">意味の近い機能語は、「どちらも入る文」と「片方しか入らない文」で違いを見る。<span class="skr">비슷한 기능어는 차이를 문장으로 확인.</span></div>
    <div class="sex"><span class="ok">終わるまで 待つ</span>（ずっと続く） ⇔ <span class="ok">金曜までに 出す</span>（一回）<br><span class="ok">映画に 誘う</span>　　<span class="ok">好きなだけ 食べる</span></div>
    <div class="stip">後ろの動詞が「続く状態」か「一回の動作」かを見る。</div>`,
  keigo:`<div class="sk">判断は一つだけ。「誰の動作か」。<span class="skr">기준은 하나. '누구의 동작인가'.</span></div>
    <div class="sex">自分の動作 → <span class="ok">お〜する</span>（お聞きする・お待ちする）<br>相手の動作 → <span class="ok">お〜になる・いらっしゃる</span></div>
    <div class="stip">聴解の「お待ちしております」も同じ判断。待つのは自分。</div>`,
  bunkei:`<div class="sk">決まった言い方は、意味を一言で言えるようにする。<span class="skr">정해진 표현은 뜻을 한마디로.</span></div>
    <div class="sex"><span class="ok">〜でたまらない</span>＝自分の気持ちがとても強い<br><span class="ok">〜わけにはいかない</span>＝事情があって、できない<br><span class="ok">〜ようがない</span>＝方法がない</div>
    <div class="stip">聴解の即時応答でも、この3つがそのまま出た。</div>`,
};

// ---------- state ----------
let items=[], idx=0, answers=[], graded=false, review=false, timerId=null, timeLeft=600, useTimer=true;
const TIME=600;
const $=id=>document.getElementById(id);

function shuffleArr(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffleItems(list){
  return list.map(it=>{
    const pairs=it.opts.map((o,i)=>({o,isAns:i===it.ans}));
    const sh=shuffleArr(pairs);
    return Object.assign({}, it, {opts:sh.map(p=>p.o), ans:sh.findIndex(p=>p.isAns)});
  });
}

function startTest(){
  items=shuffleItems(ITEMS); idx=0; graded=false; review=false;
  answers=items.map(()=>null);
  useTimer=$('useTimer').checked; timeLeft=TIME;
  $('startScreen').classList.add('hidden'); $('rScreen').classList.add('hidden');
  $('qScreen').classList.remove('hidden'); $('ctrl').classList.remove('hidden');
  $('dots').classList.remove('hidden'); $('qcount').classList.remove('hidden');
  buildDots();
  if(useTimer){ $('timer').classList.remove('hidden'); startTimer(); } else { $('timer').classList.add('hidden'); }
  render();
}
function buildDots(){
  const d=$('dots'); d.innerHTML='';
  items.forEach((it,i)=>{
    if(i>0 && it.sec!==items[i-1].sec){ const g=document.createElement('span'); g.className='gap'; d.appendChild(g); }
    const s=document.createElement('div'); s.className='d'; s.dataset.i=i; s.onclick=()=>{ idx=i; render(); }; d.appendChild(s);
  });
}
function updateDots(){
  $('dots').querySelectorAll('.d').forEach(s=>{
    const i=+s.dataset.i; s.className='d';
    if(graded){ s.classList.add(isCorrect(i)?'ok':'ng'); if(i===idx && review) s.classList.add('on'); }
    else { if(i===idx) s.classList.add('on'); else if(answers[i]!==null) s.classList.add('done'); }
  });
}
function startTimer(){
  clearInterval(timerId);
  const el=$('timer'); el.classList.add('run'); el.classList.remove('end','low');
  const tick=()=>{
    const m=String(Math.floor(timeLeft/60)).padStart(2,'0'), s=String(timeLeft%60).padStart(2,'0');
    el.textContent=`${m}:${s}`;
    el.classList.toggle('low', timeLeft<=60 && timeLeft>0);
    if(timeLeft<=0){ clearInterval(timerId); el.textContent='⏰ 時間！続けてOK'; el.classList.add('end'); return; }
    timeLeft--;
  };
  tick(); timerId=setInterval(tick,1000);
}

function render(){
  const it=items[idx], sec=SECTIONS[it.sec];
  $('qcount').textContent=`${idx+1} / ${items.length}`;
  let html=`<div class="qtag">${sec.name}</div><div class="inst">${sec.inst}</div>`;
  if(it.word){ html+=`<div class="word">${it.word}</div>`; }
  else { html+=`<div class="sent">${it.sent}</div>`; }
  const one = it.opts.some(o=>o.length>9);
  html+=`<div class="choices ${one?'one':''}">`+it.opts.map((o,i)=>`<div class="choice" data-i="${i}"><span class="no">${i+1}</span><span>${o}</span></div>`).join('')+'</div>';
  if(graded && review){ html+=`<div class="qnote">${it.note}<span class="k">${it.kr}</span></div>`; }
  $('qScreen').innerHTML=html;
  $('qScreen').querySelectorAll('.choice').forEach(c=>{
    c.onclick=()=>{ if(graded) return; answers[idx]=+c.dataset.i; paintChoices(); updateDots(); };
  });
  paintChoices();
  $('prevBtn').disabled=(idx===0);
  const last=(idx===items.length-1);
  $('nextBtn').classList.toggle('hidden', (last && !graded) || (graded && last));
  $('nextBtn').disabled=false;
  $('gradeBtn').classList.toggle('hidden', !last || graded);
  $('toResultBtn').classList.toggle('hidden', !graded);
  $('restartBtn').classList.toggle('hidden', graded);
  updateDots();
}
function paintChoices(){
  const it=items[idx];
  $('qScreen').querySelectorAll('.choice').forEach(c=>{
    const i=+c.dataset.i; c.classList.remove('sel','correct','wrong');
    if(graded){ if(i===it.ans) c.classList.add('correct'); else if(i===answers[idx]) c.classList.add('wrong'); }
    else if(answers[idx]===i) c.classList.add('sel');
  });
}
function go(d){ const n=idx+d; if(n<0||n>=items.length) return; idx=n; render(); }

function isCorrect(i){ return answers[i]===items[i].ans; }
function grade(){
  graded=true; review=false;
  if(timerId) clearInterval(timerId);
  $('timer').classList.remove('run');
  showResult();
}
function showResult(){
  review=false;
  $('qScreen').classList.add('hidden'); $('ctrl').classList.add('hidden'); $('qcount').classList.add('hidden');
  const correct=items.map((_,i)=>isCorrect(i));
  const n=correct.filter(Boolean).length, total=items.length, pct=Math.round(n/total*100);
  const wrongIdx=items.map((_,i)=>i).filter(i=>!correct[i]);
  updateDots();

  const groups=[['文字（読み・表記）',['s1','s2']],['語彙（文脈・言い換え）',['s3','s4']],['用法',['s5']],['文法',['s6']]];
  const secs=groups.map(([nm,ss])=>{
    const ids=items.map((it,i)=>i).filter(i=>ss.includes(items[i].sec));
    const k=ids.filter(i=>correct[i]).length;
    return `<div class="sec"><div class="t">${nm}</div><div class="v ${k===ids.length?'full':'part'}">${k} / ${ids.length}</div></div>`;
  }).join('');

  const rlist=items.map((it,i)=>{
    const ok=correct[i], ua=answers[i]!==null?(it.word?it.opts[answers[i]].slice(0,9)+'…':it.opts[answers[i]]):'—';
    return `<div class="ritem" data-i="${i}">
      <span class="qn">${i+1}</span>
      <span class="mk ${ok?'o':'x'}">${ok?'○':'✗'}</span>
      <span class="kj">${it.key}</span>
      <span class="co">${it.short||it.opts[it.ans]}</span>
      <span class="src ${it.src==='rel'?'rel':''}">${it.src==='rel'?'関連':'模試'}</span>
      ${ok?'':`<span class="ua">내 답: ${ua}</span>`}
    </div>`;
  }).join('');

  $('rScreen').innerHTML=`
    <div class="rtop">
      <div class="scorebig"><div class="n">${n}<small>/${total}</small></div><div class="p">${pct}%</div></div>
      <div class="secs">${secs}</div>
    </div>
    <div class="rlist">${rlist}</div>
    <div class="focus" id="focusBox"></div>
    <div class="rbtns">
      <span class="copied hidden" id="copied">✓ 복사됨 — 카카오에 붙여넣기</span>
      <button class="btn" id="copyBtn">結果をコピー</button>
      <button class="btn" id="backBtn">最初に戻る</button>
    </div>`;
  $('rScreen').classList.remove('hidden');

  $('rScreen').querySelectorAll('.ritem').forEach(r=>{
    r.onclick=()=>{ idx=+r.dataset.i; review=true;
      $('rScreen').classList.add('hidden'); $('qScreen').classList.remove('hidden');
      $('ctrl').classList.remove('hidden'); $('qcount').classList.remove('hidden'); render(); };
  });

  const cnt={}; wrongIdx.forEach(i=>{ const t=items[i].etype; cnt[t]=(cnt[t]||0)+1; });
  const keys=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const fb=$('focusBox');
  if(keys.length){
    fb.innerHTML=`<div class="ftitle">のびしろポイント<span class="fkr">성장 포인트 — 누르면 해설 ／ 문제를 누르면 그 문제로 이동</span></div>`+
      `<div class="fchips">${keys.map(t=>`<button class="fchip" data-t="${t}">${ETYPE[t].jp} ×${cnt[t]} <span class="arw">解説 ▸</span></button>`).join('')}</div>`;
    fb.querySelectorAll('.fchip').forEach(bt=>bt.onclick=()=>openExplain(bt.dataset.t));
  } else {
    fb.innerHTML=`<div class="ftitle" style="color:var(--ok)">全問正解！<span class="fkr">전부 정답! 🎉</span></div>`;
  }
  $('copyBtn').onclick=()=>copyResult(n,total,pct,wrongIdx);
  $('backBtn').onclick=backToStart;
}
function openExplain(t){
  const m=ETYPE[t]; if(!m) return;
  $('ex-title').textContent=m.jp+'　'+m.kr;
  $('ex-body').innerHTML=STOCK[t]||'';
  $('explain').classList.remove('hidden');
}
function copyResult(n,total,pct,wrongIdx){
  const wrong = wrongIdx.length ? wrongIdx.map(i=>`${items[i].key}(${items[i].short||items[i].opts[items[i].ans]})`).join(', ') : '없음 — 전부 정답!';
  const txt=`[제3회 모의고사 복습 챌린지]\n결과: ${n}/${total} (${pct}%)\n🔁 다시 볼 것: ${wrong}`;
  const done=()=>{ $('copied').textContent='✓ 복사됨 — 카카오에 붙여넣기'; $('copied').classList.remove('hidden'); setTimeout(()=>$('copied').classList.add('hidden'),2500); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>showCopyBox(txt)); }
  else { showCopyBox(txt); }
}
function showCopyBox(txt){
  let ta=document.getElementById('copyBox');
  if(!ta){ ta=document.createElement('textarea'); ta.id='copyBox'; ta.readOnly=true;
    ta.style.cssText='width:100%;height:96px;margin-top:8px;font-size:14px;padding:8px;border:1px solid #d0cec6;border-radius:8px;font-family:inherit';
    $('rScreen').appendChild(ta); }
  ta.value=txt; ta.focus(); ta.select();
  $('copied').textContent='↓ 길게 눌러 복사 — 카카오에 붙여넣기'; $('copied').classList.remove('hidden');
}
function backToStart(){
  if(timerId) clearInterval(timerId);
  graded=false; review=false;
  ['rScreen','qScreen','ctrl','dots','qcount','timer'].forEach(id=>$(id).classList.add('hidden'));
  $('startScreen').classList.remove('hidden');
}

$('startBtn').onclick=startTest;
$('prevBtn').onclick=()=>go(-1);
$('nextBtn').onclick=()=>go(1);
$('gradeBtn').onclick=grade;
$('toResultBtn').onclick=showResult;
let restartArmed=null;
$('restartBtn').onclick=()=>{
  const b=$('restartBtn');
  if(restartArmed){ clearTimeout(restartArmed); restartArmed=null; b.textContent='最初に戻る'; backToStart(); return; }
  b.textContent='もう一度押すと最初へ（答えは消えます）';
  restartArmed=setTimeout(()=>{ restartArmed=null; b.textContent='最初に戻る'; },3000);
};
$('ex-close').onclick=()=>$('explain').classList.add('hidden');
$('explain').onclick=e=>{ if(e.target.id==='explain') $('explain').classList.add('hidden'); };
document.addEventListener('keydown',e=>{
  if(!$('explain').classList.contains('hidden')){ if(e.key==='Escape') $('explain').classList.add('hidden'); return; }
  if($('qScreen').classList.contains('hidden')) return;
  if(!graded && ['1','2','3','4'].includes(e.key)){ answers[idx]=+e.key-1; paintChoices(); updateDots(); }
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
</script>
